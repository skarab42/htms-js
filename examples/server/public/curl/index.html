<!doctype html>
<html lang="en">
  <head>
    <base href="/curl/" />
    <meta charset="utf-8" />
    <title>htms-js - stream demo (optimized for curl)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preload" href="index.css" as="style" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header>
      <h1>htms-js - stream demo (optimized for curl)</h1>
    </header>
    <main>
      <section>
        <h2>News</h2>
        <div htms="getNews">Loading news...</div>
      </section>
      <section htms-module="./article.js">
        <h2>Articles</h2>
        <div htms="getMostUpvoted">Loading top upvoted...</div>
        <div htms="getLastPublished">Loading last published...</div>
      </section>
      <section>
        <h2>Stats</h2>
        <div htms="getStats">Loading stats...</div>
      </section>
    </main>
    <footer>
      <a href="https://github.com/skarab42/htms-js/tree/main/examples/server/public">source</a> -
      <a href="https://htms.skarab42.dev/">dashboard demo</a>
    </footer>
  </body>
</html>
